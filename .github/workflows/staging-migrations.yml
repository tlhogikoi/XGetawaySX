name: Apply staging database migrations

on:
  workflow_dispatch:
    inputs:
      confirm_staging_migration:
        description: Type APPLY STAGING MIGRATIONS to confirm the staging schema update
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xgetawaysx-staging-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm_staging_migration == 'APPLY STAGING MIGRATIONS' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_UNPOOLED }}
      DJANGO_DEBUG: "False"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feat/application-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate direct staging database URL
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Add STAGING_DATABASE_URL_UNPOOLED as a GitHub Actions secret before running this workflow."
            exit 1
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          host = urlparse(os.environ["DATABASE_URL"]).hostname or ""
          if "-pooler" in host:
              raise SystemExit("Use the direct, non-pooled Neon connection for migrations.")
          print("Direct database connection format verified; secret value is not displayed.")
          PY

      - name: Review pending migration plan
        run: python manage.py migrate --plan

      - name: Apply staging migrations
        run: python manage.py migrate --noinput

      - name: Verify migration state
        run: python manage.py showmigrations --plan
