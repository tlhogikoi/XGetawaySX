name: Application foundation CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xgetawaysx
          POSTGRES_USER: xgetawaysx
          POSTGRES_PASSWORD: xgetawaysx_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xgetawaysx -d xgetawaysx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://xgetawaysx:xgetawaysx_test_password@127.0.0.1:5432/xgetawaysx
      DJANGO_SECRET_KEY: ci-only-test-secret-key-not-for-deployment
      DJANGO_DEBUG: "False"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
